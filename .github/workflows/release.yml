name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,     target: aarch64-apple-darwin     }  # Apple Silicon
          - { os: macos-13,     target: x86_64-apple-darwin      }  # Intel Mac
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }  # Linux x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/context-brain dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cd dist
          tar czf ../context-brain-${{ matrix.target }}.tar.gz context-brain README.md LICENSE 2>/dev/null \
            || tar czf ../context-brain-${{ matrix.target }}.tar.gz context-brain
          cd ..
          shasum -a 256 context-brain-${{ matrix.target }}.tar.gz > context-brain-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            context-brain-${{ matrix.target }}.tar.gz
            context-brain-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true
