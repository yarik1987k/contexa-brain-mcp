[package]
name = "context-brain"
version = "0.1.0"
edition = "2021"
description = "Local-first MCP server for AI coding agents. AST extraction, semantic search, cross-session memory. No API calls."
license = "MIT"

[dependencies]
# MCP server
rmcp = { version = "1.3", features = ["transport-io"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# File walking (.gitignore support)
ignore = "0.4"

# File watching
notify = "7"

# AST parsing
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

# Embeddings (local, zero setup)
fastembed = "4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
