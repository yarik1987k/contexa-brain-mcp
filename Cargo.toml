[package]
name = "context-brain"
version = "0.1.0"
edition = "2021"
description = "Intelligent MCP context manager — pay less, get more from AI coding assistants"
license = "MIT"

[dependencies]
# MCP server
rmcp = { version = "1.3", features = ["transport-io"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP client (for Ollama)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async utilities
async-trait = "0.1"

# File walking (.gitignore support)
ignore = "0.4"

# AST parsing
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

# File watching
notify = "6"

# Embeddings (local, zero setup)
fastembed = "4"
